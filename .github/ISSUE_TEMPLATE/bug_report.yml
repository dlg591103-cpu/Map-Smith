name: 缺陷报告
description: 报告可复现的问题
title: "[缺陷] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先检索已有 Issue，避免重复。
        涉及安全问题时不要公开提交，按仓库拥有者公开的联系方式私下报告。
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 实际发生了什么，期望发生什么
      placeholder: 期望……，实际……
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 使用的命令或操作
        2. 输入的数据
        3. 出现的错误
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交
      description: 出问题的提交 SHA、分支或 SPEC 版本
      placeholder: 例如 128992f / main / V0.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、Python 版本、关键依赖版本
      placeholder: 例如 Windows 11 / Python 3.12.4 / geopandas 1.0.1
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志与截图
      description: 粘贴前请删除密钥、令牌与真实用户数据
      render: text
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 已检索现有 Issue，未找到重复
          required: true
        - label: 已移除日志中的密钥与真实用户数据
          required: true