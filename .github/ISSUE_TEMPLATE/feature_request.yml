name: 功能建议
description: 提出新功能或行为改进
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提出前请先阅读 `docs/facts/` 中已确认的产品事实；与已确认事实冲突的建议，请说明冲突点，不要直接假定事实改变。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前流程中的具体困难，而不是直接给出实现方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
      description: 用户可见的结果、输入与输出
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 考虑过的其他做法及取舍
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 产品功能
        - 文档与流程
        - 工程与工具
        - 不确定
    validations:
      required: true
  - type: textarea
    id: facts
    attributes:
      label: 相关事实与 SPEC
      description: 列出相关的 `docs/facts/` 文档或 `docs/Spec/` 条目；没有则填“无”
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 已检索现有 Issue，未找到重复
          required: true
        - label: 已阅读相关产品事实，并说明是否与其冲突
          required: true