# Map Smith 容器编排。
#
# 依据：docs/Spec/V0.1-专题制图智能体.md 第 7 节验收条件（`docker compose up` 可运行）
# 与 docs/facts/08-交付形态.md（评委不装 Python 也能运行）。
#
# 用法：docker compose up --build
# 浏览器打开 http://127.0.0.1:8501
#
# 国内网络构建（Docker Hub / pypi.org 直连常超时）：
#   PowerShell:  $env:PYTHON_IMAGE="docker.m.daocloud.io/library/python:3.12-slim"
#                $env:PIP_INDEX_URL="https://repo.huaweicloud.com/repository/pypi/simple"
#                docker compose up --build
#   bash:        PYTHON_IMAGE=... PIP_INDEX_URL=... docker compose up --build
#
# LLM 配置为可选：不配置时界面仍可用表单模式出图（离线 demo_data 兜底）。
# 一句话模式需要 base_url / api_key / model 三项，用下面的环境变量注入
# （注意：/api/health 的 llm_configured 只表示三项齐备，默认值指向本机 Ollama，
#  容器内没有该服务时它仍会报 true，但不代表可连通）。

services:
  mapsmith:
    build:
      context: .
      args:
        # 默认官方源，行为与旧版一致；网络受限时用环境变量覆盖。
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: mapsmith:v0.1.1
    container_name: mapsmith
    ports:
      - "8501:8501"
    environment:
      MAPSMITH_LLM_BASE_URL: ${MAPSMITH_LLM_BASE_URL:-}
      MAPSMITH_LLM_API_KEY: ${MAPSMITH_LLM_API_KEY:-}
      MAPSMITH_LLM_MODEL: ${MAPSMITH_LLM_MODEL:-}
    volumes:
      # 产物（PNG / PDF）持久化到宿主机 out/ 目录。
      - ./out:/app/out
    restart: unless-stopped
